[integration]
brand = "powershell"
name = "PowerShell"
description = "Integrates Orbiter with pwsh (PowerShell 7+) via LocationChangedAction hook"
roles = ["shell"]
binaries = ["pwsh"]

[shell]
exports = [
  { hook = "hook.ps1", description = "LocationChangedAction hook for directory-change context detection" },
]

[commands]
env = ["PATH", "HOME"]  # every variable the commands need, PATH included; nothing else is passed
timeout_seconds = 30
allowed = [
  { cmd = "pwsh", description = "Check that PowerShell is present and report its version (health check)" },
]

[runtime]
pool_size = 2
input_buffer_kb = 8
output_buffer_kb = 16
