[integration]
brand = "macos"
name = "macOS Keychain"
description = "Verifies macOS Keychain availability for credential access"
roles = ["keychain"]
binaries = ["security"]

[commands]
env = ["PATH", "HOME", "USER"]  # every variable the commands need, PATH included; nothing else is passed
timeout_seconds = 15
allowed = [
  { cmd = "security", description = "macOS Keychain credential access" },
]

[runtime]
pool_size = 2
input_buffer_kb = 8
output_buffer_kb = 8
