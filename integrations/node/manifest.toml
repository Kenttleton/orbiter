[integration]
brand = "node"
name = "Node.js"
description = "Scans and verifies the Node.js runtime"
roles = ["runtime"]
binaries = ["node"]

[detection]
files = ["package.json"]

[commands]
env = ["PATH", "HOME", "NODE_*"]  # every variable the commands need, PATH included; nothing else is passed
timeout_seconds = 30
allowed = [
  { cmd = "node",  description = "Node.js runtime version detection" },
]

[runtime]
pool_size = 4
input_buffer_kb = 8
output_buffer_kb = 8
