[integration]
brand = "uv"
name = "uv"
description = "Scans and verifies the uv Python package manager"
roles = ["manager"]
binaries = ["uv"]

[detection]
files = ["uv.lock"]

[commands]
env = ["PATH", "HOME", "XDG_CONFIG_HOME", "UV_*", "VIRTUAL_ENV"]  # every variable the commands need, PATH included; nothing else is passed
timeout_seconds = 30
allowed = [
  { cmd = "uv",    description = "Python package manager operations" },
]

[runtime]
pool_size = 4
input_buffer_kb = 8
output_buffer_kb = 8
