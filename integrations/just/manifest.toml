[integration]
brand = "just"
name = "just"
description = "Detects and verifies the just command runner"
roles = ["tool"]
binaries = ["just"]

[detection]
files = ["Justfile", "justfile"]

[commands]
env = ["PATH", "HOME", "JUST_*"]  # every variable the commands need, PATH included; nothing else is passed
timeout_seconds = 30
allowed = [
  { cmd = "just",  description = "Task runner operations" },
]

[runtime]
pool_size = 4
input_buffer_kb = 8
output_buffer_kb = 8
