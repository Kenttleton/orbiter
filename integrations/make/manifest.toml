[integration]
brand = "make"
name = "Make"
description = "Detects and verifies the make build tool"
roles = ["tool"]
binaries = ["make"]

[detection]
files = ["Makefile", "GNUmakefile"]

[commands]
env = ["PATH", "HOME", "MAKEFLAGS"]  # every variable the commands need, PATH included; nothing else is passed
timeout_seconds = 30
allowed = [
  { cmd = "make",  description = "Build tool operations" },
]

[runtime]
pool_size = 4
input_buffer_kb = 8
output_buffer_kb = 8
