[integration]
brand = "onepassword"
name = "1Password"
description = "Verifies 1Password CLI authentication state for vault access"
roles = ["vault"]
binaries = ["op"]

[commands]
env = ["PATH", "HOME", "XDG_CONFIG_HOME", "OP_*"]  # every variable the commands need, PATH included; nothing else is passed
timeout_seconds = 15
allowed = [
  { cmd = "op",    description = "1Password CLI credential and vault operations" },
]

[runtime]
pool_size = 2
input_buffer_kb = 8
output_buffer_kb = 8
