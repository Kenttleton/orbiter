[integration]
brand = "ssh"
name = "SSH Agent"
description = "Verifies SSH agent availability and loaded key count"
roles = ["agent"]
binaries = ["ssh-agent"]

[commands]
env = ["PATH", "HOME", "USER", "SSH_AUTH_SOCK", "SSH_AGENT_PID"]  # every variable the commands need, PATH included; nothing else is passed
timeout_seconds = 15
allowed = [
  { cmd = "ssh-agent", description = "Manage the SSH authentication agent process" },
  { cmd = "ssh-add",   description = "Add keys to and query the SSH agent" },
]

[runtime]
pool_size = 2
input_buffer_kb = 8
output_buffer_kb = 8
