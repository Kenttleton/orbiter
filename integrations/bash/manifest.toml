[integration]
brand = "bash"
name = "Bash Shell"
description = "Integrates Orbiter with bash via PROMPT_COMMAND hook"
roles = ["shell"]
binaries = ["bash"]

[shell]
exports = [
  { hook = "hook.bash", description = "PROMPT_COMMAND hook for directory-change context detection" },
]

[commands]
env = ["PATH", "HOME"]  # every variable the commands need, PATH included; nothing else is passed
timeout_seconds = 30
allowed = [
  { cmd = "bash", description = "Check that bash is present and report its version (health check)" },
]

[runtime]
pool_size = 2
input_buffer_kb = 8
output_buffer_kb = 16
