[integration]
brand = "brew"
name = "Homebrew"
description = "Scans and verifies the Homebrew package manager"
roles = ["manager"]
binaries = ["brew"]

[commands]
env = ["PATH", "HOME", "HOMEBREW_*"]  # every variable the commands need, PATH included; nothing else is passed
timeout_seconds = 30
allowed = [
  { cmd = "brew",  description = "Homebrew package manager operations" },
]

[runtime]
pool_size = 4
input_buffer_kb = 8
output_buffer_kb = 8
