[integration]
brand = "zsh"
name = "Zsh Shell"
description = "Integrates Orbiter with zsh via chpwd hook"
roles = ["shell"]
binaries = ["zsh"]

[shell]
exports = [
  { hook = "hook.zsh", description = "chpwd hook for directory-change context detection" },
]

[commands]
env = ["PATH", "HOME", "ZDOTDIR"]  # every variable the commands need, PATH included; nothing else is passed
timeout_seconds = 30
allowed = [
  { cmd = "zsh", description = "Check that zsh is present and report its version (health check)" },
]

[runtime]
pool_size = 2
input_buffer_kb = 8
output_buffer_kb = 16
